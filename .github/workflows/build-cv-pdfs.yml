name: Build bilingual CV PDFs

on:
  push:
    branches:
      - feat/bilingual-pdf-cv
    paths:
      - public/Violetta_Nicolaou_CV.docx
      - scripts/build_cv_pdfs.py
      - .github/workflows/build-cv-pdfs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/bilingual-pdf-cv

      - name: Install LibreOffice and compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-crosextra-carlito

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade python-docx

      - name: Generate English and Russian PDFs
        run: python scripts/build_cv_pdfs.py

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Violetta_Nicolaou_CV_EN.pdf public/Violetta_Nicolaou_CV_RU.pdf
          if git diff --cached --quiet; then
            echo "PDFs are already up to date."
          else
            git commit -m "Generate English and Russian PDF CVs"
            git push origin HEAD:feat/bilingual-pdf-cv
          fi
