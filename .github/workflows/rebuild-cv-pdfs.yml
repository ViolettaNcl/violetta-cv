name: Rebuild CV PDFs

on:
  push:
    branches:
      - fix/tech-stack-card-alignment
    paths:
      - scripts/build_visual_cv_pdfs.py
      - .github/workflows/rebuild-cv-pdfs.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/tech-stack-card-alignment

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-font-awesome

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ReportLab
        run: python -m pip install reportlab

      - name: Generate English and Russian PDFs
        run: python scripts/build_visual_cv_pdfs.py

      - name: Commit corrected PDFs
        run: |
          git config user.name "ViolettaNcl"
          git config user.email "148069072+ViolettaNcl@users.noreply.github.com"
          git add public/Violetta_Nicolaou_CV_EN.pdf public/Violetta_Nicolaou_CV_RU.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Fix Technical Stack alignment in CV PDFs"
          git push origin HEAD:fix/tech-stack-card-alignment
