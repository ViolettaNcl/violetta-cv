name: Build visual A4 CV PDFs

on:
  push:
    branches:
      - feat/visual-a4-pdf-cv
    paths:
      - scripts/build_visual_cv_pdfs.py
      - .github/workflows/build-visual-cv-pdfs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/visual-a4-pdf-cv

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-font-awesome
          python -m pip install --upgrade reportlab

      - name: Generate English and Russian vector PDFs
        run: python scripts/build_visual_cv_pdfs.py

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Violetta_Nicolaou_CV_EN.pdf public/Violetta_Nicolaou_CV_RU.pdf
          if git diff --cached --quiet; then
            echo "PDFs are already up to date"
          else
            git commit -m "Update visual A4 CV PDFs"
            git push origin HEAD:feat/visual-a4-pdf-cv
          fi
